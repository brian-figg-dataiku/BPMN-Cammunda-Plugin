<style>
  html, body { height: 100%; margin: 0; padding: 0; }
  .bpmn-container { display: flex; height: 100vh; width: 100vw; }
  #canvas { flex: 1; height: 100%; }
  #properties-panel { width: 350px; height: 100%; border-left: 1px solid #ccc; background-color: #f8f8f8; overflow-y: auto; }
</style>

<div class="bpmn-container">
  <div id="canvas"></div>
  <div id="properties-panel"></div>
</div>

<button id="save-button" style="position: absolute; bottom: 20px; left: 20px; z-index: 100; padding: 10px; cursor: pointer; font-family: sans-serif; font-weight: bold; background-color: #2ab1ac; color: white; border: none; border-radius: 4px;">
  Save to Dataiku
</button>
